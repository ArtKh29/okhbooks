    + '<span class="fnote">ПКМ по блоку — меню: дублировать / выше / ниже / удалить</span>'
    + '</div>'
    + (pd.blocks.length ? pd.blocks.map(pageBlockCard).join('') : '<div class="empty"><p>Пока нет блоков. Добавь первый — заголовок или текст.</p></div>')
    + '</div>';
}

// ---------- сюжетное дерево ----------
function outlineOf(bookId) { return data.outlines[bookId] || (data.outlines[bookId] = []); }

function outlineFindNode(list, id) {
  for (const n of list || []) {
    if (n.id === id) return n;
    const r = outlineFindNode(n.children, id);
    if (r) return r;
  }
  return null;
}
function outlineFindParent(list, id) {
  for (const n of list || []) {
    if ((n.children || []).some(c => c.id === id)) return n;
    const r = outlineFindParent(n.children, id);
    if (r) return r;
  }
  return null;
}
function outlineRemoveNode(list, id) {
  for (let i = 0; i < list.length; i++) {
    if (list[i].id === id) return list.splice(i, 1)[0];
    const r = outlineRemoveNode(list[i].children || [], id);
    if (r) return r;
  }
  return null;
}
function outlineContains(node, id) {
  if (!node) return false;
  if (node.id === id) return true;
  return (node.children || []).some(c => outlineContains(c, id));
}
function outlineCount(n) { let k = (n.children || []).length; (n.children || []).forEach(c => { k += outlineCount(c); }); return k; }

async function outlineSave() {
  if (!authed()) { toast('Нужно войти', 'err'); return; }
  const res = await sb.from('book_outline').upsert({
    book_id: outlineBookId, data: outlineOf(outlineBookId), updated_at: new Date().toISOString()
  });
  if (res.error) toast('Не сохранилось: ' + res.error.message, 'err');
}

function renderAdminOutline(mine) {
  if (!outlineBookId || !mine.some(b => b.id === outlineBookId)) outlineBookId = mine[0] ? mine[0].id : '';
  if (!outlineBookId) return '<div class="form-card"><h3>Сюжет</h3><div class="empty"><p>Сначала добавь книгу — сюжет привязан к ней.</p></div></div>';
  const book = getBook(outlineBookId);
  const tree = outlineOf(book.id);
  return '<div class="form-card">'
    + '<div class="otoolbar">'
    + (mine.length > 1
      ? '<select class="finput" style="width:auto;height:34px;padding:0 12px;border-radius:999px" onchange="outlineBookId=this.value;render()">'
        + mine.map(b => '<option value="' + b.id + '" ' + (b.id === outlineBookId ? 'selected' : '') + '>' + esc(b.title) + '</option>').join('') + '</select>'
      : '<span class="pill">' + esc(book.title) + '</span>')
    + '<button class="btn-ghost btn-sm" onclick="outlineAddRoot()">＋ мысль</button>'
    + '<span class="grow"></span>'
    + '<button class="btn-ghost btn-sm" onclick="outlineSave()">Сохранить</button>'
    + '</div>'
    + (tree.length
      ? '<div class="otree">' + tree.map(n => outlineNodeHTML(n, 0)).join('') + '</div>'
      : '<div class="empty"><p>Пусто. Добавь первую мысль — завязку, сцену, поворот.</p></div>')
    + '<p class="fnote" style="margin-top:12px">Тяни строки для порядка и вложенности. Клик по статусу/типу — цикл. «→гл» превращает мысль в главу.</p>'
    + '</div>';
}

function outlineNodeHTML(n, d) {
  const kids = n.children || [];
  const open = !outlineCollapsed.has(n.id);
  const st = n.status || 'идея';
  const title = '<span class="otitle ' + (st === 'готово' ? 'done' : '') + '" title="Переименовать" onclick="outlineRename(\'' + n.id + '\')">' + esc(n.title || 'Без названия') + '</span>';
  return '<div class="obeat ' + (st === 'отброшено' ? 'off' : '') + '" data-id="' + n.id + '" draggable="true" ondragstart="outlineDragStart(event,\'' + n.id + '\')" ondragend="outlineDragEnd()">'
    + '<div class="obeat-row" style="--d:' + d + '" ondragover="outlineDragOver(event,\'' + n.id + '\')" ondrop="outlineDrop(event,\'' + n.id + '\')">'
    + '<button class="otwist" onclick="outlineToggle(\'' + n.id + '\')">' + (kids.length ? (open ? '▾' : '▸') : '·') + '</button>'
    + '<span class="ochip' + (st !== 'идея' ? ' ochip-' + st : '') + '" onclick="outlineCycleStatus(\'' + n.id + '\')">' + esc(st) + '</span>'
    + title
    + '<span class="okind" title="Тип" onclick="outlineCycleKind(\'' + n.id + '\')">' + esc(n.kind || 'тип') + '</span>'
    + (n.chapter_id ? '<span class="olink" onclick="outlineOpenChapter(\'' + n.chapter_id + '\')">гл.</span>' : '')
    + '<span class="obeat-acts">'
    + '<button class="obtn" title="Вложенная мысль" onclick="outlineAddChild(\'' + n.id + '\')">＋</button>'
    + '<button class="obtn" title="Соседняя мысль" onclick="outlineAddSib(\'' + n.id + '\')">↩</button>'
    + '<button class="obtn" title="Заметка" onclick="outlineToggleNote(\'' + n.id + '\')">📝</button>'
    + '<button class="obtn acc" title="Сделать главой" onclick="outlineToChapter(\'' + n.id + '\')">→гл</button>'
    + '<button class="obtn" title="Удалить" onclick="outlineDelete(\'' + n.id + '\')">✕</button>'
    + '</span>'
    + '</div>'
    + (n.note && outlineNoteFor !== n.id ? '<div class="obeat-note" style="--d:' + d + '">' + esc(n.note.slice(0, 160)) + '</div>' : '')
    + (outlineNoteFor === n.id ? '<div class="onote" style="--d:' + d + '"><textarea oninput="outlineSetNote(\'' + n.id + '\',this.value)">' + esc(n.note || '') + '</textarea><div class="onote-foot"><button class="btn-primary btn-sm" onclick="outlineNoteDone()">Готово</button><button class="btn-ghost btn-sm" onclick="outlineNoteCancel()">Отмена</button></div></div>' : '')
    + (kids.length && open ? '<div class="okids">' + kids.map(k => outlineNodeHTML(k, d + 1)).join('') + '</div>' : '')
    + '</div>';
}

async function outlineAdd(parentId, afterId) {
  const tree = outlineOf(outlineBookId);
  const n = { id: ouid(), title: 'Новая мысль', note: '', status: 'идея', kind: '', chapter_id: null, children: [] };
  if (afterId) {
    const parent = outlineFindParent(tree, afterId);
    const arr = parent ? parent.children : tree;
    const i = arr.findIndex(x => x.id === afterId);
    arr.splice(i + 1, 0, n);
  } else if (parentId) {
    const p = outlineFindNode(tree, parentId);
    if (p) (p.children = p.children || []).push(n); else tree.push(n);
  } else tree.push(n);
  await outlineSave();
  render();
  outlineRename(n.id);
}
function outlineAddRoot() { outlineAdd(null, null); }
function outlineAddChild(id) { outlineAdd(id, null); }
function outlineAddSib(id) { outlineAdd(null, id); }

async function outlineRename(id) {
  const n = outlineFindNode(outlineOf(outlineBookId), id);
  if (!n) return;
  const v = prompt('Название мысли', n.title || '');
  if (v === null) return;
  const t = (v || '').trim();
  if (!t) return;
  n.title = t;
  await outlineSave();
  render();
}

async function outlineCycleStatus(id) {
  const n = outlineFindNode(outlineOf(outlineBookId), id);
  if (!n) return;
  const i = OUTLINE_STATUSES.indexOf(n.status || 'идея');
  n.status = OUTLINE_STATUSES[(i + 1) % OUTLINE_STATUSES.length];
  await outlineSave(); render();
}
async function outlineCycleKind(id) {
  const n = outlineFindNode(outlineOf(outlineBookId), id);
  if (!n) return;
  const i = OUTLINE_KINDS.indexOf(n.kind || '');
  n.kind = i === -1 ? OUTLINE_KINDS[0] : OUTLINE_KINDS[(i + 1) % OUTLINE_KINDS.length];
  await outlineSave(); render();
}

function outlineToggle(id) { if (outlineCollapsed.has(id)) outlineCollapsed.delete(id); else outlineCollapsed.add(id); render(); }

function outlineToggleNote(id) { outlineNoteFor = outlineNoteFor === id ? null : id; render(); }
function outlineSetNote(id, value) { const n = outlineFindNode(outlineOf(outlineBookId), id); if (n) n.note = value; }
async function outlineNoteDone() { outlineNoteFor = null; await outlineSave(); render(); }
function outlineNoteCancel() { outlineNoteFor = null; render(); }

async function outlineDelete(id) {
  const n = outlineFindNode(outlineOf(outlineBookId), id);
  if (!n) return;
  const kids = outlineCount(n);
  if (!confirm('Удалить мысль «' + (n.title || '') + '»' + (kids ? ' вместе с ' + kids + ' вложенными' : '') + '?')) return;
  outlineRemoveNode(outlineOf(outlineBookId), id);
  await outlineSave(); render();
}

async function outlineToChapter(id) {
  const n = outlineFindNode(outlineOf(outlineBookId), id);
  if (!n) return;
  if (n.chapter_id) { outlineOpenChapter(n.chapter_id); return; }
  const nums = chaptersOf(outlineBookId).map(c => c.num);
  const next = (nums.length ? Math.max.apply(null, nums) : 0) + 1;
  const r = await sb.from('chapters').insert({ book_id: outlineBookId, num: next, title: n.title || ('Глава ' + next), content: n.note || '' }).select().single();
  if (r.error) { toast(r.error.message, 'err'); return; }
  n.chapter_id = r.data.id;
  n.status = 'пишу';
  await outlineSave();
  await loadData(); render();
  toast('Глава создана из мысли');
}
function outlineOpenChapter(chapterId) { navigate('chapter', { chapterId }); }

function outlineDragStart(e, id) { outlineDragId = id; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', id); } catch (err) {} }
function outlineDragEnd() {
  outlineDragId = null;
  $$('.obeat-row').forEach(r => r.classList.remove('drop-before', 'drop-after', 'drop-inside'));
}
function outlineDragOver(e, id) {
  e.preventDefault();
  const row = e.target && e.target.closest ? e.target.closest('.obeat-row') : null;
  if (!row) return;
  const r = row.getBoundingClientRect();
  const ratio = (e.clientY - r.top) / r.height;
  const xRatio = (e.clientX - r.left) / r.width;
  $$('.obeat-row').forEach(x => x.classList.remove('drop-before', 'drop-after', 'drop-inside'));
  if (xRatio > 0.6) row.classList.add('drop-inside');
  else if (ratio < 0.5) row.classList.add('drop-before');
  else row.classList.add('drop-after');
}
async function outlineDrop(e, id) {
  e.preventDefault();
  const row = e.target && e.target.closest ? e.target.closest('.obeat-row') : null;
  if (!row) return;
  const mode = row.classList.contains('drop-inside') ? 'inside' : row.classList.contains('drop-before') ? 'before' : 'after';
  const dragId = outlineDragId;
  outlineDragEnd();
  if (!dragId || dragId === id) return;
  const tree = outlineOf(outlineBookId);
  const src = outlineFindNode(tree, dragId);
  if (!src) return;
  if (outlineContains(src, id)) return;
  const node = outlineRemoveNode(tree, dragId);
  if (mode === 'inside') {
    const t = outlineFindNode(tree, id);
    if (t) (t.children = t.children || []).push(node); else tree.push(node);
  } else {
    const parent = outlineFindParent(tree, id);
    const arr = parent ? parent.children : tree;
    const i = arr.findIndex(x => x.id === id);
    arr.splice(mode === 'before' ? i : i + 1, 0, node);
  }
  await outlineSave(); render();
}

// ---------- аудио ----------
let players = [], cuePlayers = [], cueTimers = [];
function initAudio() {
  players = []; cuePlayers = []; cueTimers = [];
  const chapter = getChapter(route.chapterId); if (!chapter) return;
  const audios = mediaOf(chapter).filter(m => m.type === 'audio');
  audios.filter(a => !(a.pos > 0)).forEach((a, i) => {
    const el = new Audio(); if (a.url) el.src = a.url; players[i] = el;
    el.addEventListener('timeupdate', () => {
      if (!el.duration) return;
      const f = document.getElementById('fill' + i); if (f) f.style.width = (el.currentTime / el.duration * 100) + '%';
      const c = document.getElementById('cur' + i); if (c) c.textContent = fmtTime(el.currentTime);
    });
    el.addEventListener('loadedmetadata', () => { const d = document.getElementById('dur' + i); if (d) d.textContent = fmtTime(el.duration); });
    el.addEventListener('ended', () => { const p = document.getElementById('play' + i); if (p) p.textContent = '▶'; });
  });
  audios.filter(a => a.pos > 0).forEach((a, k) => {
    const el = new Audio(); if (a.url) el.src = a.url; cuePlayers[k] = el;
    el.addEventListener('timeupdate', () => {
      if (!el.duration) return;
      const f = document.getElementById('cueFill' + k); if (f) f.style.width = (el.currentTime / el.duration * 100) + '%';
      const c = document.getElementById('cueCur' + k); if (c) c.textContent = fmtTime(el.currentTime);
    });
    el.addEventListener('ended', () => stopCue(k));
  });
}
function toggleAudio(i) {
  const el = players[i]; if (!el) return;
  const btn = document.getElementById('play' + i);
  if (!el.getAttribute('src')) { toast('Ссылка не указана', 'err'); return; }
  if (el.paused) {
    players.forEach((p, j) => { if (j !== i && p && !p.paused) { p.pause(); const b = document.getElementById('play' + j); if (b) b.textContent = '▶'; } });
    cuePlayers.forEach((p, j) => { if (p && !p.paused) stopCue(j); });
    el.play().catch(() => toast('Не удалось воспроизвести', 'err'));
    if (btn) btn.textContent = '❚❚';
  } else { el.pause(); if (btn) btn.textContent = '▶'; }
}
function seekAudio(e, i) {
  const el = players[i]; if (!el || !el.duration) return;
  const bar = document.getElementById('bar' + i); if (!bar) return;
  const r = bar.getBoundingClientRect();
  el.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * el.duration;
}
function stopCue(k) {
  const el = cuePlayers[k];
  if (el && !el.paused) el.pause();
  if (cueTimers[k]) { clearTimeout(cueTimers[k]); cueTimers[k] = null; }
  const p = document.getElementById('cuePlay' + k); if (p) p.textContent = '▶';
  const f = document.getElementById('cueFill' + k); if (f) f.style.width = '0%';
  const c = document.getElementById('cueCur' + k); if (c) c.textContent = '0:00';
}
function toggleCue(k) {
  const el = cuePlayers[k]; if (!el) return;
  const btn = document.getElementById('cuePlay' + k);
  if (!el.getAttribute('src')) { toast('Ссылка не указана', 'err'); return; }
  if (!el.paused) { stopCue(k); return; }
  players.forEach((p, j) => { if (p && !p.paused) { p.pause(); const b = document.getElementById('play' + j); if (b) b.textContent = '▶'; } });
  cuePlayers.forEach((p, j) => { if (j !== k && p && !p.paused) stopCue(j); });
  const chapter = getChapter(route.chapterId);
  const cue = mediaOf(chapter).filter(m => m.type === 'audio').filter(a => a.pos > 0)[k];
  const dur = (cue && cue.dur) || 0;
  el.currentTime = 0;
  el.play().catch(() => toast('Не удалось воспроизвести', 'err'));
  if (btn) btn.textContent = '❚❚';
  if (dur > 0) cueTimers[k] = setTimeout(() => stopCue(k), dur * 1000);
}
function seekCue(e, k) {
  const el = cuePlayers[k]; if (!el || !el.duration) return;
  const bar = e.target.closest ? e.target.closest('.cue-bar') : null; if (!bar) return;
  const r = bar.getBoundingClientRect();
  el.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * el.duration;
}

// ---------- фото ----------
function openPhoto(el) {
  const url = typeof el === 'string' ? el : (el && el.dataset ? el.dataset.url : '');
  if (!url) return;
  const img = $('#modalImg'); if (img) img.src = url;
  const m = $('#photoModal'); if (m) m.classList.add('open');
}
function closePhoto() {
  const m = $('#photoModal'); if (m) m.classList.remove('open');
  const img = $('#modalImg'); if (img) img.src = '';
}

// ---------- эффекты ----------
function initScroll() {
  const hdr = document.querySelector('.hdr');
  const onScroll = () => { if (hdr) hdr.classList.toggle('scrolled', scrollY > 8); };
  addEventListener('scroll', onScroll, { passive: true });
  onScroll();
}

// ---------- старт ----------
function savedTheme() { try { return localStorage.getItem('okh_theme') || 'dark'; } catch (e) { return 'dark'; } }
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('okh_theme', t); } catch (e) {}
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  applyTheme(cur);
  render();
}

async function boot(fromLogin) {
  applyTheme(savedTheme());
  const { data: s } = await sb.auth.getSession();
  session = s.session || null;
  await loadProfile();
  await loadData();
  if (fromLogin) { navigate('admin'); return; }
  render();
  updateNav();
}

sb.auth.onAuthStateChange(async (event) => {
  if (event === 'SIGNED_IN' || event === 'SIGNED_OUT' || event === 'TOKEN_REFRESHED') {
    const { data: s } = await sb.auth.getSession();
    session = s.session || null;
    await loadProfile();
    await loadData();
    render();
  }
});

addEventListener('keydown', e => { if (e.key === 'Escape') closePhoto(); });
addEventListener('scroll', initScroll, { passive: true });

boot();

</script>
