<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  color-scheme:dark;
  --bg:#131416;--panel:#18191b;--panel2:#1c1d20;--line:#26282c;
  --ink:#fafafa;--muted:#9aa1ad;--dim:#6b7280;--accent:#cf3a2f;--accent-hover:#e04b3e;
  --r:10px;--ease:cubic-bezier(.2,.7,.2,1);
  --f-ui:'Exo 2',system-ui,'Segoe UI',sans-serif;
  --f-read:'Merriweather',Georgia,serif;
}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:var(--accent);color:#fff}
::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#2c2e33;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#3a3d43}

/* шапка */
.hdr{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--line)}
.hdr-in{max-width:1240px;margin:0 auto;padding:0 20px;height:60px;display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;cursor:pointer;flex-shrink:0}
.logo-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;letter-spacing:.02em}
.hsearch{position:relative;flex:1;max-width:520px;margin:0 auto}
.hsearch input{width:100%;height:38px;padding:0 16px 0 38px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:14px;transition:border-color .2s,background .2s}
.hsearch input::placeholder{color:var(--dim)}
.hsearch input:focus{outline:none;border-color:var(--accent);background:var(--panel2)}
.hsearch svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--dim);pointer-events:none}
.hnav{display:flex;gap:8px;margin-left:auto}
.pill{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 16px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:13.5px;font-weight:500;color:var(--ink);cursor:pointer;transition:background .2s,border-color .2s;white-space:nowrap}
.pill:hover{background:var(--panel2);border-color:#34373d}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff}

.wrap{max-width:1240px;margin:0 auto;padding:0 20px}

/* заголовок раздела */
.hero{position:relative;margin:18px 0 6px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#15161a;display:grid;grid-template-columns:1.02fr .98fr;min-height:320px}
.hero-inner{position:relative;z-index:2;padding:34px 34px;display:flex;flex-direction:column;justify-content:center;max-width:none}
.hero-art{position:relative;background-image:url('makima.jpg');background-image:image-set(url('makima.jpg') 1x,url('makima-2x.jpg') 2x);background-position:center 24%;background-size:cover;background-repeat:no-repeat;animation:kb 32s ease-in-out infinite alternate;will-change:transform}
.hero-art::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#15161a 0%,rgba(21,22,26,.6) 22%,rgba(21,22,26,0) 62%),linear-gradient(0deg,rgba(21,22,26,.5) 0%,rgba(21,22,26,0) 40%)}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.1)}}
.hero h1{font-size:clamp(1.9rem,4vw,2.8rem);font-weight:700;letter-spacing:-.025em;margin:0 0 8px;line-height:1.12}
.hero p{color:#c9ccd1;font-size:15px;margin:0;max-width:46ch}
.hero-tag{display:inline-flex;align-items:center;height:26px;padding:0 11px;border-radius:999px;background:rgba(207,58,47,.16);border:1px solid rgba(207,58,47,.42);color:#ff9c92;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px}

.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:22px 0 14px}
.section-head h2{font-size:19px;font-weight:600;margin:0}
.section-head .count{font-size:13px;color:var(--dim)}

/* сетка обложек */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:20px 16px}
.card{cursor:pointer;display:flex;flex-direction:column;gap:9px;min-width:0}
.cover{position:relative;aspect-ratio:2/3;background:var(--cover,#1c1d20);background-size:cover;background-position:center;overflow:hidden;border-radius:var(--r)}
.cover img.covimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.72));z-index:1}
.cover h3{position:absolute;left:10px;right:10px;bottom:9px;z-index:2;font-size:13px;font-weight:600;line-height:1.3;margin:0;color:#fff;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card:hover .cover{box-shadow:0 10px 26px -12px rgba(0,0,0,.9);transform:translateY(-2px)}
.cover{transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.ctitle{font-size:14px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card:hover .ctitle{color:var(--accent-hover)}
.cmeta{display:flex;gap:8px;font-size:12px;color:var(--dim);min-width:0}
.cmeta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* пусто */
.empty{padding:40px 0;color:var(--muted)}
.empty h3{font-size:17px;font-weight:600;margin:0 0 6px;color:var(--ink)}
.empty p{margin:0;font-size:14px}

/* страница книги */
.breadcrumbs{display:flex;gap:8px;align-items:center;padding:18px 0;font-size:13px;color:var(--dim)}
.breadcrumbs a{color:var(--muted);cursor:pointer}
.breadcrumbs a:hover{color:var(--ink)}
.book-head{display:flex;gap:26px;padding:6px 0 26px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.book-cover{width:196px;aspect-ratio:2/3;flex-shrink:0;border-radius:var(--r);overflow:hidden;position:relative;background:var(--cover,#1c1d20);background-size:cover;background-position:center}
.book-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.book-info{flex:1;min-width:260px}
.book-info h1{font-size:clamp(1.5rem,3vw,2rem);font-weight:700;letter-spacing:-.02em;margin:0 0 10px}
.book-info .genre{display:inline-flex;height:26px;align-items:center;padding:0 11px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:12.5px;color:var(--muted);margin:0 6px 8px 0}
.book-info .author{color:var(--muted);font-size:14px;margin:6px 0 12px}
.book-info .author b{color:var(--ink)}
.book-info .desc{color:var(--muted);font-size:14px;line-height:1.65;margin:0 0 16px;max-width:62ch}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px 13px;min-width:70px}
.stat b{display:block;font-size:16px;font-weight:600;line-height:1.25}
.stat span{font-size:11.5px;color:var(--dim)}

/* главы */
.chapters{margin-top:20px}
.chapter{display:flex;align-items:center;gap:14px;padding:13px 12px;border-radius:var(--r);cursor:pointer;transition:background .15s}
.chapter:hover{background:var(--panel)}
.chapter:not(:last-child){border-bottom:1px solid rgba(255,255,255,.04)}
.num{width:34px;height:34px;border-radius:9px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--muted);flex-shrink:0}
.ch-title{font-size:14.5px;font-weight:600;line-height:1.35}
.ch-sub{font-size:12px;color:var(--dim);margin-top:2px}
.badges{margin-left:auto;display:flex;gap:6px;flex-shrink:0}
.badge{height:22px;display:inline-flex;align-items:center;padding:0 8px;border-radius:999px;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
.b-audio{color:#8fd3a8;border-color:rgba(143,211,168,.35)}
.b-video{color:#e08b7f;border-color:rgba(224,139,127,.35)}
.b-photo{color:#93aede;border-color:rgba(147,174,222,.35)}

/* читалка */
.reader{max-width:720px;margin:0 auto;padding:26px 0 70px}
.back{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:13px;color:var(--muted);cursor:pointer;transition:.2s}
.back:hover{color:var(--ink);border-color:#34373d}
.reader h1{font-size:clamp(1.5rem,3.2vw,2.1rem);font-weight:700;letter-spacing:-.02em;margin:20px 0 6px;line-height:1.2}
.reader .sub{font-size:13px;color:var(--dim);margin-bottom:26px}
.reader-content{font-family:var(--f-read);font-size:17px;line-height:1.85;color:#e6e6e6;margin-bottom:34px}
.reader-content p{margin:0 0 1.15em}
.media-block{margin-bottom:26px}
.media-label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}

.audio{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);margin-bottom:10px}
.play{width:38px;height:38px;border-radius:50%;background:var(--accent);display:grid;place-items:center;cursor:pointer;color:#fff;flex-shrink:0;border:none;font-size:13px;transition:background .2s}
.play:hover{background:var(--accent-hover)}
.play.disabled{background:var(--panel2);color:var(--dim);cursor:not-allowed}
.a-info{flex:1;min-width:0}
.a-title{font-size:14px;font-weight:600;margin-bottom:8px}
.a-bar{height:4px;border-radius:2px;background:#2b2e33;cursor:pointer;overflow:hidden}
.a-fill{height:100%;width:0;background:var(--accent);transition:width .1s linear}
.a-time{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);margin-top:5px}
.a-hint{font-size:11.5px;color:var(--dim);margin-top:5px}

.cue{display:flex;align-items:center;gap:12px;margin:18px 0;padding:11px 13px;border-radius:var(--r);background:rgba(207,58,47,.09);border:1px solid rgba(207,58,47,.3)}
.cue-play{width:32px;height:32px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#fff;cursor:pointer;flex-shrink:0;border:none;font-size:12px;transition:background .2s}
.cue-play:hover{background:var(--accent-hover)}
.cue-play.disabled{background:var(--panel2);color:var(--dim);cursor:not-allowed}
.cue-info{flex:1;min-width:0}
.cue-title{font-size:13px;font-weight:600;margin-bottom:6px}
.cue-bar{height:3px;border-radius:2px;background:#2b2e33;overflow:hidden;cursor:pointer}
.cue-fill{height:100%;width:0;background:var(--accent);transition:width .1s linear}
.cue-time{font-size:11px;color:var(--dim);margin-top:4px}

.video{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#000}
.video video{width:100%;display:block;max-height:400px}
.video .cap{padding:10px 13px;font-size:12.5px;color:var(--muted);background:var(--panel)}

.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.photo{position:relative;aspect-ratio:4/3;border-radius:var(--r);overflow:hidden;background:var(--panel);cursor:pointer}
.photo img{width:100%;height:100%;object-fit:cover;transition:transform .25s var(--ease)}
.photo:hover img{transform:scale(1.04)}
.photo .cap{position:absolute;left:0;right:0;bottom:0;padding:7px 10px;font-size:11px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.78))}

.nav2{display:flex;justify-content:space-between;gap:12px;margin-top:38px}
.nav2 button{height:40px;padding:0 18px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--ink);font-size:13.5px;cursor:pointer;transition:.2s}
.nav2 button:hover:not(:disabled){background:var(--panel2);border-color:#34373d}
.nav2 button:disabled{opacity:.35;cursor:not-allowed}

/* модалка фото */
.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
.modal.open{opacity:1;pointer-events:all}
.modal-bg{position:absolute;inset:0;background:rgba(8,9,10,.94)}
.modal img{position:relative;max-width:92vw;max-height:86vh;object-fit:contain;border-radius:8px}
.modal .close{position:absolute;top:16px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--panel);border:1px solid var(--line);color:var(--ink);font-size:1.1rem;cursor:pointer;z-index:2}
.modal .close:hover{border-color:var(--accent);color:var(--accent)}

footer{margin-top:50px;border-top:1px solid var(--line)}
.foot{max-width:1240px;margin:0 auto;padding:18px 20px 40px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--dim)}
.foot a{color:var(--muted)}
.foot a:hover{color:var(--ink)}

.toast-box{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:10px 16px;border-radius:999px;font-size:13px;background:var(--panel2);border:1px solid var(--line);animation:toastIn .25s ease,toastOut .25s ease 2.6s forwards}
.toast.ok{border-color:rgba(143,211,168,.4)}
.toast.err{border-color:rgba(207,58,47,.55)}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}}
@keyframes toastOut{to{opacity:0}}

/* ---- светлая тема ---- */
html[data-theme="light"]{color-scheme:light;--bg:#f4f4f6;--panel:#ffffff;--panel2:#eeeef1;--line:#e0e0e5;--ink:#17171a;--muted:#5d6067;--dim:#8a8d95}
html[data-theme="light"] body{background:#f4f4f6;color:#17171a}
html[data-theme="light"] .hdr{background:#fff;border-bottom-color:#e6e6ea}
html[data-theme="light"] .hsearch input,html[data-theme="light"] .pill,html[data-theme="light"] .userchip{background:#f1f1f4;border-color:#e2e2e7;color:#17171a}
html[data-theme="light"] .a-bar,html[data-theme="light"] .cue-bar{background:#dcdde2}
html[data-theme="light"] .chapter:not(:last-child){border-bottom-color:#ececf0}
html[data-theme="light"] .toast{background:#fff;color:#17171a;border-color:#e2e2e7}
html[data-theme="light"] .form-card,html[data-theme="light"] .item,html[data-theme="light"] .mrow,html[data-theme="light"] .madd,html[data-theme="light"] .profile-card{background:#fff;border-color:#e2e2e7}
html[data-theme="light"] .field input,html[data-theme="light"] .field textarea,html[data-theme="light"] .field select,html[data-theme="light"] .mini input,html[data-theme="light"] .mini select,html[data-theme="light"] .finput{background:#f7f7f9;border-color:#e0e0e6;color:#17171a}
html[data-theme="light"] .mtype{background:#eeeef1;color:#5d6067}
html[data-theme="light"] .btn-ghost{background:#fff;border-color:#dcdce2;color:#17171a}
html[data-theme="light"] .btn-ghost:hover{background:#f0f0f3}
html[data-theme="light"] .cover h3{color:#fff}
html[data-theme="light"] .reader-content{color:#2a2a30}
html[data-theme="light"] .hero p{color:#e9e9ee}
.themebtn{font-size:15px;padding:0 12px}
/* --- аккаунт и редактор --- */
.authbar{display:flex;align-items:center;gap:8px;margin-left:auto}
.userchip{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px 0 4px;border-radius:999px;background:var(--panel);border:1px solid var(--line);cursor:pointer;font-size:13px;transition:background .2s,border-color .2s}
.userchip:hover{background:var(--panel2);border-color:#34373d}
.avatar{width:28px;height:28px;border-radius:50%;object-fit:cover;display:grid;place-items:center;background:var(--accent);color:#fff;font-size:12px;font-weight:600}
.avatar-empty{background:var(--accent)}
.avatar-lg{width:56px;height:56px;font-size:20px}
.authbox{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:20px;margin-top:16px}
.flabel{display:block;font-size:12px;color:var(--dim);margin-bottom:6px}
.finput{width:100%;height:40px;padding:0 13px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px}
.finput:focus{outline:none;border-color:var(--accent)}
.fnote{font-size:12px;color:var(--dim);line-height:1.5}
.orline{display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--dim);font-size:12px}
.orline::before,.orline::after{content:'';height:1px;background:var(--line);flex:1}
.btn-primary,.btn-ghost,.btn-danger{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 18px;border-radius:10px;font-size:14px;font-weight:600;border:1px solid transparent;cursor:pointer;transition:.2s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover)}
.btn-ghost{background:var(--panel);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--panel2)}
.btn-danger{background:rgba(207,58,47,.14);border-color:rgba(207,58,47,.35);color:#ff9c92}
.btn-danger:hover{background:rgba(207,58,47,.24)}
.btn-sm{height:32px;padding:0 12px;font-size:12.5px;border-radius:8px}
.admin{max-width:860px;margin:0 auto}
.admin-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;margin-bottom:18px}
.tab{height:36px;padding:0 16px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:13.5px;cursor:pointer}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.form-card{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:18px;margin-bottom:18px}
.form-card h3{margin:0 0 14px;font-size:16px}
.field{margin-bottom:12px}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
// ============================================================
// OkhBooks — приложение на Supabase
// ============================================================
const SUPA_URL = 'https://qaxtkvqtskxpwmhfodah.supabase.co';
const SUPA_KEY = 'sb_publishable_4Y8C8jX7cjXs7ejlAwNdIQ_s1CWPf-H';
const SITE = 'OkhBooks';

const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

let session = null;
let profile = null;
let data = { books: [], chapters: [], outlines: {} };
let loading = true;

// ---------- утилиты ----------
function esc(v) {
  if (v === null || v === undefined) return '';
  return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function toast(msg, kind) {
  const box = $('#toasts');
  if (!box) return;
  const t = document.createElement('div');
  t.className = 'toast ' + (kind || 'ok');
  t.textContent = msg;
  box.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}
function fmtDate(d) {
  if (!d) return '';
  const dt = new Date(d);
  if (isNaN(dt.getTime())) return '';
  return dt.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
}
function fmtTime(s) { if (!s || isNaN(s)) return '0:00'; const m = Math.floor(s / 60), x = Math.floor(s % 60); return m + ':' + (x < 10 ? '0' : '') + x; }
const wc = t => { const s = (t || '').trim(); return s ? s.split(/\s+/).length : 0; };
const authed = () => !!(session && session.user);
const myId = () => (session && session.user ? session.user.id : null);

const COVERS = ['#a8322a', '#1d1d1b', '#7d2a20', '#2b2b28', '#5a1f18', '#141412'];
const coverOf = b => b.cover_url || COVERS[(b.cover || 0) % COVERS.length];

const getBook = id => data.books.find(b => b.id === id);
const getChapter = id => data.chapters.find(c => c.id === id);
const chaptersOf = bookId => data.chapters.filter(c => c.bookId === bookId).sort((a, b) => a.num - b.num);
const mediaOf = c => Array.isArray(c && c.media) ? c.media : [];

// ---------- загрузка данных ----------
async function loadData() {
  loading = true;
  const [b, c, m, o, pg, ar, bm, fr, pr] = await Promise.all([
    sb.from('books').select('*').order('created_at', { ascending: false }),
    sb.from('chapters').select('*').order('num', { ascending: true }),
    sb.from('media').select('*').order('created_at', { ascending: true }),
    sb.from('book_outline').select('*'),
    sb.from('site_pages').select('*'),
    sb.from('access_requests').select('*'),
    sb.from('book_marks').select('*'),
    sb.from('friendships').select('*'),
    sb.from('profiles').select('*')
  ]);
  if (b.error) toast('Не удалось загрузить книги: ' + b.error.message, 'err');
  const books = (b.data || []).map(x => ({
    id: x.id, ownerId: x.owner_id, title: x.title, author: x.author, genre: x.genre,
    desc: x.description, cover_url: x.cover_url, status: x.status, stage: x.stage || 'writing',
    createdAt: x.created_at
  }));
  const chapters = (c.data || []).map(x => ({
    id: x.id, bookId: x.book_id, num: x.num, title: x.title, content: x.content,
    createdAt: x.created_at, media: []
  }));
  const byChapter = {};
  (chapters || []).forEach(ch => { byChapter[ch.id] = ch.media; });
  (m.data || []).forEach(row => {
    const arr = byChapter[row.chapter_id];
    if (arr) arr.push({ id: row.id, type: row.kind, url: row.url, title: row.title, caption: row.caption, pos: row.pos || 0, dur: row.dur || 0 });
  });
  const outlines = {};
  (o.data || []).forEach(row => { outlines[row.book_id] = Array.isArray(row.data) ? row.data : []; });
  const pages = {};
  (pg.data || []).forEach(row => { pages[row.user_id] = { slug: row.slug, data: row.data || {} }; });
  const marks = {};
  (bm.data || []).forEach(row => {
    if (!marks[row.user_id]) marks[row.user_id] = {};
    marks[row.user_id][row.book_id] = row.status;
  });
  data = { books, chapters, outlines, pages, requests: (ar.data || []), marks, friends: (fr.data || []), profiles: (pr.data || []) };
  loading = false;
}

// ---------- друзья ----------
let frQuery = '';

function friendRecord(uid) {
  const me = myId();
  return (data.friends || []).find(f =>
    (f.requester_id === me && f.addressee_id === uid) ||
    (f.addressee_id === me && f.requester_id === uid)) || null;
}

function friendState(uid) {
  const f = friendRecord(uid);
  if (!f) return null;
  if (f.status === 'accepted') return 'friends';
  return f.requester_id === myId() ? 'outgoing' : 'incoming';
}

function profileOf(id) {
  return (data.profiles || []).find(p => p.id === id) || null;
}

function friendName(id) {
  const p = profileOf(id);
  return (p && p.display_name) || 'пользователь';
}

function friendAvatarHtml(id) {
  const p = profileOf(id);
  const name = friendName(id);
  if (p && p.avatar_url) return '<img class="avatar" src="' + esc(p.avatar_url) + '" alt="">';
  return '<span class="avatar avatar-empty">' + esc(name.slice(0, 1).toUpperCase()) + '</span>';
}

async function sendFriend(uid) {
  if (!authed()) { toast('Войди, чтобы добавлять друзей', 'err'); return; }
  const r = await sb.from('friendships').insert({ requester_id: myId(), addressee_id: uid });
  if (r.error) { toast(r.error.message, 'err'); return; }
  await loadData(); render(); toast('Заявка отправлена');
}

async function acceptFriend(id) {
  const r = await sb.from('friendships').update({ status: 'accepted' }).eq('id', id);
  if (r.error) { toast(r.error.message, 'err'); return; }
  await loadData(); render(); toast('Теперь вы друзья');
}

async function removeFriendship(id) {
  const r = await sb.from('friendships').delete().eq('id', id);
  if (r.error) { toast(r.error.message, 'err'); return; }
  await loadData(); render();
}

function friendRowHtml(id, actions) {
  return '<div class="item"><div style="display:flex;align-items:center;gap:10px">' + friendAvatarHtml(id)
    + '<div><div class="t">' + esc(friendName(id)) + '</div></div></div>'
    + '<div class="acts">' + actions + '</div></div>';
}

function renderFriends() {
  if (!authed()) return renderLogin();
  const me = myId();
  const all = data.friends || [];
  const friends = all.filter(f => f.status === 'accepted');
  const incoming = all.filter(f => f.status === 'pending' && f.addressee_id === me);
  const outgoing = all.filter(f => f.status === 'pending' && f.requester_id === me);
  const q = frQuery.trim().toLowerCase();
  const others = (data.profiles || [])
    .filter(p => p.id !== me)
    .filter(p => !q || String(p.display_name || '').toLowerCase().includes(q));

  return '<div class="wrap"><div class="admin" style="padding-top:26px">'
    + '<h2 style="margin:0 0 16px;font-size:22px">Друзья</h2>'
    + '<div class="settings-sec"><h3>Найти людей</h3>'
    + '<input id="fr-search" class="finput" placeholder="Имя или ник" value="' + esc(frQuery) + '" oninput="frSearch(this.value)">'
    + '<div class="list" style="margin-top:12px">'
    + (others.length ? others.slice(0, 40).map(p => {
        const st = friendState(p.id);
        let acts;
        if (st === 'friends') acts = '<button class="btn-ghost btn-sm" onclick="removeFriendship(\'' + friendRecord(p.id).id + '\')">Убрать</button>';
        else if (st === 'outgoing') acts = '<button class="btn-ghost btn-sm" disabled>Заявка отправлена</button>';
        else if (st === 'incoming') acts = '<button class="btn-primary btn-sm" onclick="acceptFriend(\'' + friendRecord(p.id).id + '\')">Принять</button>';
        else acts = '<button class="btn-primary btn-sm" onclick="sendFriend(\'' + p.id + '\')">Добавить</button>';
        return friendRowHtml(p.id, acts);
      }).join('') : '<div class="hint">Никого не нашли.</div>')
    + '</div></div>'
    + '<div class="settings-sec"><h3>Входящие заявки</h3>'
    + (incoming.length ? '<div class="list">' + incoming.map(f => friendRowHtml(f.requester_id,
        '<button class="btn-primary btn-sm" onclick="acceptFriend(\'' + f.id + '\')">Принять</button>'
        + '<button class="btn-ghost btn-sm" onclick="removeFriendship(\'' + f.id + '\')">Отклонить</button>')).join('') + '</div>'
      : '<div class="hint">Новых заявок нет.</div>')
    + '</div>'
    + (outgoing.length ? '<div class="settings-sec"><h3>Исходящие</h3><div class="list">' + outgoing.map(f => friendRowHtml(f.addressee_id,
        '<button class="btn-ghost btn-sm" onclick="removeFriendship(\'' + f.id + '\')">Отменить</button>')).join('') + '</div></div>' : '')
    + '<div class="settings-sec"><h3>Мои друзья</h3>'
    + (friends.length ? '<div class="list">' + friends.map(f => friendRowHtml(f.requester_id === me ? f.addressee_id : f.requester_id,
        '<button class="btn-ghost btn-sm" onclick="removeFriendship(\'' + f.id + '\')">Убрать</button>')).join('') + '</div>'
      : '<div class="hint">Пока никого — найди людей выше и добавь.</div>')
    + '</div>'
    + '</div></div>';
}

function frSearch(v) {
  frQuery = v;
  render();
  const el = document.getElementById('fr-search');
  if (el) { el.focus(); el.setSelectionRange(v.length, v.length); }
}


// ---------- закладки читателя ----------
const MARK_LABELS = { planned: 'В планах', reading: 'Читаю', read: 'Прочитано', dropped: 'Брошено' };

function markOf(bookId) {
  const mm = (data.marks && data.marks[myId()]) || {};
  return mm[bookId] || null;
}

async function setMark(bookId, status) {
  if (!authed()) { toast('Войди, чтобы сохранять закладки', 'err'); return; }
  if (!data.marks) data.marks = {};
  if (!data.marks[myId()]) data.marks[myId()] = {};
  const cur = data.marks[myId()][bookId];
  if (cur === status) {
    delete data.marks[myId()][bookId];
    const r = await sb.from('book_marks').delete().eq('user_id', myId()).eq('book_id', bookId);
    if (r.error) { toast(r.error.message, 'err'); return; }
  } else {
    data.marks[myId()][bookId] = status;
    const r = await sb.from('book_marks').upsert({
      user_id: myId(), book_id: bookId, status, updated_at: new Date().toISOString()
    });
    if (r.error) { toast(r.error.message, 'err'); return; }
  }
  render();
}

function bookCard(b) {
  const ch = chaptersOf(b.id);
  return '<article class="card" onclick="navigate(\'book\',{bookId:\'' + b.id + '\'})">'
    + '<div class="cover" style="--cover:' + esc(coverOf(b)) + '">'
    + (b.cover_url ? '<img class="covimg" src="' + esc(b.cover_url) + '" alt="" loading="lazy">' : '')
    + '<h3>' + esc(b.title) + '</h3></div>'
    + '<div class="ctitle">' + esc(b.title) + '</div>'
    + '<div class="cmeta"><span>' + esc(b.genre || 'Без жанра') + '</span><span>' + ch.length + ' гл.</span></div>'
    + '</article>';
}

function renderMarks() {
  if (!authed()) return renderLogin();
  const mm = (data.marks && data.marks[myId()]) || {};
  const keys = ['reading', 'planned', 'read', 'dropped'];
  const cur = route.status && MARK_LABELS[route.status] ? route.status : 'reading';
  const ids = Object.keys(mm).filter(id => mm[id] === cur);
  const books = data.books.filter(b => ids.indexOf(b.id) !== -1);
  return '<div class="wrap"><div class="admin" style="padding-top:26px">'
    + '<h2 style="margin:0 0 16px;font-size:22px">Закладки</h2>'
    + '<div class="tabs">' + keys.map(k =>
      '<button class="tab ' + (cur === k ? 'active' : '') + '" onclick="navigate(\'marks\',{status:\'' + k + '\'})">' + MARK_LABELS[k] + (Object.keys(mm).filter(id => mm[id] === k).length ? ' · ' + Object.keys(mm).filter(id => mm[id] === k).length : '') + '</button>'
    ).join('') + '</div>'
    + (books.length ? '<div class="grid">' + books.map(bookCard).join('') + '</div>'
      : '<div class="empty"><p>Тут пока пусто. Отмечай книги на их страницах — «Читаю», «Прочитано» и так далее.</p></div>')
    + '</div></div>';
}

async function loadProfile() {
  if (!authed()) { profile = null; return; }
  const { data: p } = await sb.from('profiles').select('*').eq('id', myId()).maybeSingle();
  profile = p || null;
  if (!profile) {
    const u = session.user;
    profile = {
      id: u.id,
      display_name: (u.user_metadata && (u.user_metadata.full_name || u.user_metadata.name)) || (u.email || '').split('@')[0],
      avatar_url: (u.user_metadata && u.user_metadata.avatar_url) || null
    };
  }
}

// ---------- роутер ----------
let route = { page: 'home' };
function navigate(page, params = {}) {
  route = { page, ...params };
  render();
  scrollTo({ top: 0, behavior: 'smooth' });
  updateNav();
}
function updateNav() {
  const map = { home: 'nav-home', book: 'nav-home', chapter: 'nav-home', admin: 'nav-admin', profile: 'nav-admin' };
  $$('.hnav .pill').forEach(p => p.classList.remove('on'));
  const id = map[route.page];
  const el = id ? document.getElementById(id) : null;
  if (el) el.classList.add('on');
}

// ---------- рендер ----------
function render() {
  const app = $('#app');
  if (loading) {
    app.innerHTML = '<div class="wrap"><div class="empty"><h3>Загружаю…</h3></div></div>';
    renderAuthBar();
    return;
  }
  switch (route.page) {
    case 'home': app.innerHTML = renderHome(); break;
    case 'book': app.innerHTML = renderBook(); break;
    case 'chapter': app.innerHTML = renderChapter(); break;
    case 'login': app.innerHTML = renderLogin(); break;
    case 'profile': app.innerHTML = renderProfile(); break;
    case 'settings': app.innerHTML = renderSettings(); break;
    case 'marks': app.innerHTML = renderMarks(); break;
    case 'friends': app.innerHTML = renderFriends(); break;
    case 'admin': app.innerHTML = renderAdmin(); break;
    default: app.innerHTML = renderHome();
  }
  if (route.page === 'chapter') initAudio();
  renderAuthBar();
}

function renderAuthBar() {
  const box = $('#authbar');
  if (!box) return;
  if (!authed()) {
    box.innerHTML = '<span class="pill" onclick="navigate(\'login\')">Войти</span>';
    return;
  }
  const name = (profile && profile.display_name) || (session.user.email || '').split('@')[0];
  const av = profile && profile.avatar_url
    ? '<img class="avatar" src="' + esc(profile.avatar_url) + '" alt="">'
    : '<span class="avatar avatar-empty">' + esc(name.slice(0, 1).toUpperCase()) + '</span>';
  box.innerHTML = '<span class="pill" onclick="navigate(\'admin\')" id="nav-admin">Мои книги</span>'
    + '<span class="userchip" onclick="toggleUserMenu(event)">' + av + '<span>' + esc(name) + '</span></span>';
}

function toggleUserMenu(e) {
  e.preventDefault();
  e.stopPropagation();
  closeUserMenu();
  const name = (profile && profile.display_name) || (session.user.email || '').split('@')[0];
  const email = (session.user && session.user.email) || '';
  const m = document.createElement('div');
  m.id = 'usermenu';
  m.className = 'usermenu';
  const r = e.currentTarget.getBoundingClientRect();
  m.style.left = Math.max(8, Math.min(innerWidth - 232, r.right - 220)) + 'px';
  m.style.top = (r.bottom + 8) + 'px';
  m.innerHTML = '<div class="um-head"><b>' + esc(name) + '</b><small>' + esc(email) + '</small></div>'
    + '<button onclick="closeUserMenu();navigate(\'profile\')">Профиль</button>'
    + '<button onclick="closeUserMenu();navigate(\'admin\')">Мои книги</button>'
    + '<button onclick="closeUserMenu();navigate(\'marks\',{status:\'reading\'})">Закладки</button>'
    + '<button onclick="closeUserMenu();navigate(\'friends\')">Друзья</button>'
    + '<button onclick="closeUserMenu();navigate(\'settings\')">Настройки</button>'
    + '<button class="danger" onclick="closeUserMenu();signOut()">Выйти</button>';
  document.body.appendChild(m);
}

function closeUserMenu() { const m = document.getElementById('usermenu'); if (m) m.remove(); }
document.addEventListener('click', closeUserMenu);

function homePageOwner() {
  if (authed() && data.pages && data.pages[myId()]) return myId();
  const owners = [];
  (data.books || []).forEach(b => { if (b.ownerId && owners.indexOf(b.ownerId) === -1) owners.push(b.ownerId); });
  for (let i = 0; i < owners.length; i++) if (data.pages && data.pages[owners[i]]) return owners[i];
  const keys = data.pages ? Object.keys(data.pages) : [];
  return keys.length ? keys[0] : null;
}

function pageBlockHasContent(b) {
  if (!b) return false;
  if (b.type === 'divider') return true;
  if (b.type === 'gallery') return Array.isArray(b.urls) && b.urls.length > 0;
  if (b.type === 'heading' || b.type === 'text' || b.type === 'quote') return !!(b.text || '').trim();
  if (b.type === 'button') return !!(b.text || '').trim() || !!(b.url || '').trim();
  return !!(b.url || '').trim() || !!(b.caption || '').trim();
}

function renderHome() {
  const books = data.books.filter(b => b.status === 'published');
  const owner = homePageOwner();
  const page = owner && data.pages ? data.pages[owner] : null;
  const pd = page && page.data ? page.data : null;
  const custom = pd && Array.isArray(pd.blocks) && pd.blocks.some(pageBlockHasContent);
  const bg = pd && pd.background ? pd.background : '';

  const hero = '<section class="hero"><div class="hero-art"></div>'
    + '<div class="hero-inner">'
    + '<div class="hero-tag">Библиотека</div>'
    + '<h1>Книги, в которых есть музыка</h1>'
    + '<p>Текст, музыка, снимки и видео внутри глав. Читай, слушай и смотри.</p>'
    + '</div></section>';

  return '<div class="wrap">'
    + (custom
      ? '<div class="pb-page" style="' + (bg ? 'background:' + esc(bg) + ';border-radius:16px;padding:24px 22px;margin-top:16px' : '') + '">' + renderPageBlocks(pd) + '</div>'
      : hero)
    + '<div class="section-head"><h2>Новые книги</h2><span class="count">' + books.length + ' книг</span></div>'
    + '<div id="booksGrid">' + renderBooks(books) + '</div>'
    + '</div>';
}

function renderBooks(books) {
  if (!books.length) {
    return '<div class="empty"><h3>Пока пусто</h3><p>'
      + (authed() ? 'Добавь первую книгу в «Мои книги».' : 'Автор ещё наполняет библиотеку.')
      + '</p></div>';
  }
  return '<div class="grid">' + books.map(bookCard).join('') + '</div>';
}

function renderBook() {
  const book = getBook(route.bookId);
  if (!book) return '<div class="wrap"><div class="empty"><h3>Книга не найдена</h3></div></div>';
  const ch = chaptersOf(book.id);
  const words = ch.reduce((s, c) => s + wc(c.content), 0);
  const na = ch.reduce((s, c) => s + mediaOf(c).filter(m => m.type === 'audio').length, 0);
  const np = ch.reduce((s, c) => s + mediaOf(c).filter(m => m.type === 'photo').length, 0);
  return '<div class="wrap">'
    + '<div class="breadcrumbs"><a onclick="navigate(\'home\')">Библиотека</a><span>/</span><span>' + esc(book.title) + '</span></div>'
    + '<div class="book-head">'
    + '<div class="book-cover" style="--cover:' + esc(coverOf(book)) + '">'
    + (book.cover_url ? '<img src="' + esc(book.cover_url) + '" alt="">' : '')
    + '</div>'
    + '<div class="book-info">'
    + '<h1>' + esc(book.title) + '</h1>'
    + '<span class="genre">' + esc(book.genre || 'Без жанра') + '</span>'
    + '<span class="badge" style="margin-left:8px">' + (book.stage === 'finished' ? 'закончена' : 'пишется') + '</span>'
    + (book.author ? '<div class="author">Автор: <b>' + esc(book.author) + '</b></div>' : '')
    + '<p class="desc">' + esc(book.desc || 'Описание не добавлено.') + '</p>'
    + (authed()
      ? '<div class="marks" style="display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px">'
        + Object.keys(MARK_LABELS).map(k =>
          '<button class="pill ' + (markOf(book.id) === k ? 'on' : '') + '" onclick="setMark(\'' + book.id + '\',\'' + k + '\')">' + MARK_LABELS[k] + '</button>').join('')
        + '</div>'
      : '<div class="fnote" style="margin:0 0 14px">Войди, чтобы отметить: «Читаю», «Прочитано», «В планах».</div>')
    + '<div class="stats">'
    + '<div class="stat"><b>' + ch.length + '</b><span>глав</span></div>'
    + '<div class="stat"><b>' + words + '</b><span>слов</span></div>'
    + '<div class="stat"><b>' + na + '</b><span>аудио</span></div>'
    + '<div class="stat"><b>' + np + '</b><span>фото</span></div>'
    + '</div></div></div>'
    + '<div class="chapters">'
    + (ch.length ? ch.map((c, i) => {
      const m = mediaOf(c);
      const has = t => m.some(x => x.type === t);
      return '<div class="chapter" onclick="navigate(\'chapter\',{chapterId:\'' + c.id + '\'})">'
        + '<div class="num">' + (c.num || i + 1) + '</div>'
        + '<div><div class="ch-title">' + esc(c.title) + '</div><div class="ch-sub">' + fmtDate(c.createdAt) + '</div></div>'
        + '<div class="badges">'
        + (has('audio') ? '<span class="badge b-audio">аудио</span>' : '')
        + (has('video') ? '<span class="badge b-video">видео</span>' : '')
        + (has('photo') ? '<span class="badge b-photo">фото</span>' : '')
        + '</div></div>';
    }).join('') : '<div class="empty"><p>Глав пока нет</p></div>')
    + '</div></div>';
}

function renderChapter() {
  const chapter = getChapter(route.chapterId);
  if (!chapter) return '<div class="wrap"><div class="empty"><h3>Глава не найдена</h3></div></div>';
  const book = getBook(chapter.bookId);
  const all = chaptersOf(chapter.bookId);
  const idx = all.findIndex(c => c.id === chapter.id);
  const prev = idx > 0 ? all[idx - 1] : null;
  const next = idx < all.length - 1 ? all[idx + 1] : null;
  const m = mediaOf(chapter);
  const audios = m.filter(x => x.type === 'audio');
  const videos = m.filter(x => x.type === 'video');
  const photos = m.filter(x => x.type === 'photo');
  const topAudios = audios.filter(a => !(a.pos > 0));
  const cueAudios = audios.filter(a => a.pos > 0);
  const cuesByPos = {};
  cueAudios.forEach((a, k) => { const p = a.pos; (cuesByPos[p] = cuesByPos[p] || []).push(k); });
  let paraNum = 0;
  const contentHtml = (chapter.content || '').split('\n').map(line => {
    const t = line.trim();
    if (!t) return '';
    // строка без медиа-маркеров — обычный абзац
    if (t.indexOf('[[media:') === -1) {
      paraNum++;
      let h = '<p>' + esc(t) + '</p>';
      if (cuesByPos[paraNum]) {
        h += cuesByPos[paraNum].map(k => {
          const a = cueAudios[k];
          return '<div class="cue">'
            + '<div class="cue-play ' + (a.url ? '' : 'disabled') + '" id="cuePlay' + k + '" onclick="toggleCue(' + k + ')">▶</div>'
            + '<div class="cue-info">'
            + '<div class="cue-title">' + esc(a.title || 'Музыка') + '</div>'
            + '<div class="cue-bar" onclick="seekCue(event,' + k + ')"><div class="cue-fill" id="cueFill' + k + '"></div></div>'
            + '<div class="cue-time"><span id="cueCur' + k + '">0:00</span> / <span>' + (a.dur > 0 ? a.dur + ' с' : 'весь трек') + '</span></div>'
            + '</div></div>';
        }).join('');
      }
      return h;
    }
    // строка с маркерами [[media:URL|kind|title]]
    const re = /\[\[media:([^|\]]+)\|(audio|photo|video)\|([^\]]*)\]\]/g;
    let out = '';
    let last = 0;
    let m;
    while ((m = re.exec(t))) {
      const before = t.slice(last, m.index).trim();
      if (before) out += '<p>' + esc(before) + '</p>';
      out += inlineMediaHtml(m[1], m[2], m[3]);
      last = m.index + m[0].length;
    }
    const after = t.slice(last).trim();
    if (after) out += '<p>' + esc(after) + '</p>';
    return out;
  }).join('');

  return '<div class="wrap"><div class="reader">'
    + '<a class="back" onclick="navigate(\'book\',{bookId:\'' + chapter.bookId + '\'})">← К книге</a>'
    + '<h1>' + esc(chapter.title) + '</h1>'
    + '<div class="sub">' + (book ? esc(book.title) : '') + ' · глава ' + chapter.num + '</div>'
    + (topAudios.length ? '<div class="media-block"><div class="media-label">музыка</div>'
      + topAudios.map((a, i) => '<div class="audio">'
        + '<div class="play ' + (a.url ? '' : 'disabled') + '" id="play' + i + '" onclick="toggleAudio(' + i + ')">▶</div>'
        + '<div class="a-info"><div class="a-title">' + esc(a.title || 'Музыка') + '</div>'
        + '<div class="a-bar" id="bar' + i + '" onclick="seekAudio(event,' + i + ')"><div class="a-fill" id="fill' + i + '"></div></div>'
        + '<div class="a-time"><span id="cur' + i + '">0:00</span><span id="dur' + i + '">—</span></div>'
        + (a.url ? '' : '<div class="a-hint">Ссылка не указана</div>')
        + '</div></div>').join('')
      + '</div>' : '')
    + (contentHtml ? '<div class="reader-content">' + contentHtml + '</div>' : '<div class="empty" style="padding:26px"><p>Текст главы пока пуст</p></div>')
    + (videos.length ? '<div class="media-block"><div class="media-label">видео</div>'
      + videos.map(v => '<div class="video">'
        + (v.url ? '<video controls preload="metadata"><source src="' + esc(v.url) + '"></video>' : '<div style="padding:30px;text-align:center;color:var(--dim)">Ссылка не указана</div>')
        + (v.caption ? '<div class="cap">' + esc(v.caption) + '</div>' : '')
        + '</div>').join('')
      + '</div>' : '')
    + (photos.length ? '<div class="media-block"><div class="media-label">иллюстрации</div><div class="photos">'
      + photos.map(p => '<div class="photo" data-url="' + esc(p.url || '') + '" onclick="openPhoto(this)">'
        + (p.url ? '<img src="' + esc(p.url) + '" alt="" loading="lazy">' : '')
        + (p.caption ? '<div class="cap">' + esc(p.caption) + '</div>' : '')
        + '</div>').join('')
      + '</div></div>' : '')
    + '<div class="nav2">'
    + '<button ' + (prev ? 'onclick="navigate(\'chapter\',{chapterId:\'' + prev.id + '\'})"' : 'disabled') + '>← Предыдущая</button>'
    + '<button ' + (next ? 'onclick="navigate(\'chapter\',{chapterId:\'' + next.id + '\'})"' : 'disabled') + '>Следующая →</button>'
    + '</div></div></div>';
}

// ---------- медиа внутри текста ----------
function inlineMediaHtml(url, kind, title) {
  const u = esc(url || '');
  if (kind === 'photo') {
    return '<div class="media-block"><div class="photos"><div class="photo" data-url="' + u + '" onclick="openPhoto(this)">'
      + (url ? '<img src="' + u + '" alt="" loading="lazy">' : '<div style="padding:20px;color:var(--dim)">фото без ссылки</div>')
      + (title ? '<div class="cap">' + esc(title) + '</div>' : '')
      + '</div></div></div>';
  }
  if (kind === 'video') {
    return '<div class="media-block"><div class="video">'
      + (url ? '<video controls preload="metadata"><source src="' + u + '"></video>' : '<div style="padding:30px;text-align:center;color:var(--dim)">Ссылка не указана</div>')
      + (title ? '<div class="cap">' + esc(title) + '</div>' : '')
      + '</div></div>';
  }
  return '<div class="media-block">' + miniAudioHtml(url) + '</div>';
}

function miniAudioHtml(url) {
  return '<div class="ma-player" data-src="' + esc(url || '') + '">'
    + '<button class="ma-play" onclick="maToggle(this)">▶</button>'
    + '<div class="ma-bar" onclick="maSeek(event,this)"><i></i></div>'
    + '<span class="ma-time">0:00</span>'
    + '</div>';
}

const MA = new WeakMap();
const maFmt = (s) => {
  if (!s || isNaN(s)) return '0:00';
  s = Math.floor(s);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
};

function maToggle(btn) {
  const box = btn.closest('.ma-player');
  if (!box) return;
  const src = box.getAttribute('data-src') || '';
  if (!src) { toast('Ссылка не указана', 'err'); return; }
  let a = MA.get(box);
  if (!a) {
    a = new Audio(src);
    a.preload = 'metadata';
    MA.set(box, a);
    const bar = box.querySelector('.ma-bar i');
    const tm = box.querySelector('.ma-time');
    a.addEventListener('timeupdate', () => {
      if (bar && a.duration) bar.style.width = (a.currentTime / a.duration * 100) + '%';
      if (tm) tm.textContent = maFmt(a.currentTime) + ' / ' + maFmt(a.duration);
    });
    a.addEventListener('loadedmetadata', () => { if (tm) tm.textContent = '0:00 / ' + maFmt(a.duration); });
    a.addEventListener('ended', () => {
      btn.textContent = '▶';
      if (bar) bar.style.width = '0%';
      if (tm) tm.textContent = '0:00 / ' + maFmt(a.duration);
    });
  }
  document.querySelectorAll('.ma-player').forEach((other) => {
    if (other === box) return;
    const oa = MA.get(other);
    if (oa && !oa.paused) { oa.pause(); const ob = other.querySelector('.ma-play'); if (ob) ob.textContent = '▶'; }
  });
  if (a.paused) {
    a.play().catch(() => toast('Не удалось воспроизвести', 'err'));
    btn.textContent = '❚❚';
  } else {
    a.pause();
    btn.textContent = '▶';
  }
}

function maSeek(e, bar) {
  const box = bar.closest('.ma-player');
  if (!box) return;
  const a = MA.get(box);
  if (!a || !a.duration) return;
  const r = bar.getBoundingClientRect();
  a.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * a.duration;
}

function insertAtCursor(el, text) {
  if (!el) return;
  const s = typeof el.selectionStart === 'number' ? el.selectionStart : el.value.length;
  const e = typeof el.selectionEnd === 'number' ? el.selectionEnd : el.value.length;
  el.value = el.value.slice(0, s) + text + el.value.slice(e);
  const pos = s + text.length;
  if (el.setSelectionRange) el.setSelectionRange(pos, pos);
  el.focus();
}

function mediaKindOf(file) {
  const t = (file.type || '').toLowerCase();
  if (t.indexOf('image') === 0) return 'photo';
  if (t.indexOf('video') === 0) return 'video';
  return 'audio';
}

async function insertMediaFile(file) {
  const ta = document.getElementById('c-content');
  if (!ta) { toast('Сначала открой редактор главы', 'err'); return; }
  if (!file) return;
  toast('Загружаю файл…');
  const url = await uploadFile(file);
  if (!url) return;
  const kind = mediaKindOf(file);
  let title = (file.name || '').replace(/\.[^.]+$/, '').slice(0, 60).replace(/[|\]]/g, ' ');
  if (/^[\d\s._-]+$/.test(title)) title = '';
  const marker = '\n[[media:' + url + '|' + kind + '|' + title + ']]\n';
  insertAtCursor(ta, marker);
  toast('Файл вставлен в текст');
}

function insertMediaInline(input) {
  const f = input.files && input.files[0];
  input.value = '';
  if (f) insertMediaFile(f);
}

document.addEventListener('dragover', (e) => {
  const ta = e.target;
  if (ta && ta.id === 'c-content') { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; }
});
document.addEventListener('drop', (e) => {
  const ta = e.target;
  if (!ta || ta.id !== 'c-content') return;
  e.preventDefault();
  try {
    if (document.caretRangeFromPoint) {
      const range = document.caretRangeFromPoint(e.clientX, e.clientY);
      if (range && range.startContainer === ta) {
        ta.selectionStart = ta.selectionEnd = range.startOffset;
      }
    }
  } catch (err) {}
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) insertMediaFile(f);
});

function authErr(msg) {
  const el = document.getElementById('auth-err');
  if (el) el.textContent = msg || '';
  if (msg) toast(msg, 'err');
}

async function doSignIn() {
  const email = ($('#auth-email').value || '').trim();
  const pass = $('#auth-pass').value || '';
  if (!email) return authErr('Введи почту');
  if (!pass) return authErr('Введи пароль');
  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) {
    if (/not confirmed/i.test(error.message)) return authErr('Почта не подтверждена — открой письмо и подтверди, потом войди.');
    return authErr(error.message);
  }
  await boot(true);
  toast('Вы вошли');
}

async function doSignUp() {
  const email = ($('#auth-email').value || '').trim();
  const pass = $('#auth-pass').value || '';
  const pass2 = $('#auth-pass2').value || '';
  if (!email) return authErr('Введи почту');
  if (pass.length < 6) return authErr('Пароль — минимум 6 символов');
  if (pass !== pass2) return authErr('Пароли не совпадают');
  const redirectTo = location.origin + location.pathname;
  const { data, error } = await sb.auth.signUp({ email, password: pass, options: { emailRedirectTo: redirectTo } });
  if (error) return authErr(error.message);
  if (data && data.session) { await boot(true); toast('Аккаунт создан'); return; }
  const hint = document.getElementById('login-hint');
  if (hint) hint.innerHTML = 'Аккаунт создан. Проверь <b>' + esc(email) + '</b> — там письмо для подтверждения. После него войди по паролю.';
  toast('Проверь почту');
}

async function requestAccess() {
  const email = ($('#access-email').value || '').trim().toLowerCase();
  if (!email || email.indexOf('@') === -1) return authErr('Введи почту');
  const { error } = await sb.from('access_requests').insert({ email });
  if (error && !/duplicate|unique|уже/i.test(error.message)) return authErr(error.message);
  const hint = document.getElementById('login-hint');
  if (hint) hint.innerHTML = 'Заявка оставлена для <b>' + esc(email) + '</b>. Автор пришлёт приглашение на эту почту.';
  toast('Заявка отправлена');
}

async function uploadCover(input) {
  const f = input.files && input.files[0];
  if (!f) return;
  const url = await uploadFile(f);
  if (url) { $('#b-cover-url').value = url; toast('Обложка загружена'); }
}

async function uploadFile(file) {
  if (!authed()) { toast('Нужно войти', 'err'); return null; }
  const safe = file.name.replace(/[^\w.\-]+/g, '_');
  const path = myId() + '/' + Date.now() + '-' + safe;
  const up = await sb.storage.from('media').upload(path, file, { upsert: false, cacheControl: '3600' });
  if (up.error) { toast('Загрузка не удалась: ' + up.error.message, 'err'); return null; }
  const pub = sb.storage.from('media').getPublicUrl(path);
  return pub.data.publicUrl;
}

async function saveBook() {
  const title = ($('#b-title').value || '').trim();
  if (!title) { toast('Введите название', 'err'); return; }
  const payload = {
    title,
    author: ($('#b-author').value || '').trim() || null,
    genre: ($('#b-genre').value || '').trim() || null,
    description: ($('#b-desc').value || '').trim() || null,
    cover_url: ($('#b-cover-url').value || '').trim() || null,
    status: $('#b-status').value,
    stage: $('#b-stage') ? $('#b-stage').value : 'writing'
  };
  let res;
  if (editBookId) res = await sb.from('books').update(payload).eq('id', editBookId).select();
  else res = await sb.from('books').insert(Object.assign({ owner_id: myId() }, payload)).select();
  if (res.error) { toast(res.error.message, 'err'); return; }
  editBookId = null;
  await loadData();
  render();
  toast('Сохранено');
}

async function deleteBook(id) {
  if (!confirm('Удалить книгу и все её главы?')) return;
  const res = await sb.from('books').delete().eq('id', id);
  if (res.error) { toast(res.error.message, 'err'); return; }
  await loadData(); render(); toast('Книга удалена');
}

async function uploadMediaFile(input) {
  const f = input.files && input.files[0];
  if (!f) return;
  const url = await uploadFile(f);
  if (url) { $('#m-url').value = url; toast('Файл загружен'); }
}

function renderMedia() {
  if (!tempMedia.length) return '<div class="fnote" style="padding:6px">Медиа не добавлено</div>';
  return tempMedia.map((m, i) =>
    '<div class="mrow">'
    + '<span class="mtype ' + m.type + '">' + m.type + '</span>'
    + '<span class="murl" title="' + esc(m.url || '') + '">' + esc(m.url || '(без ссылки)') + '</span>'
    + '<span class="murl" style="max-width:110px">' + esc(m.title || '') + '</span>'
    + (m.pos || m.dur ? '<span class="murl" style="max-width:90px">' + (m.pos ? 'абз.' + m.pos : '') + (m.dur ? ' ' + m.dur + 'с' : '') + '</span>' : '')
    + '<div class="mdel" onclick="tempMedia.splice(' + i + ',1);renderMediaInto()">×</div>'
    + '</div>').join('');
}
function renderMediaInto() { const el = $('#mediaList'); if (el) el.innerHTML = renderMedia(); }

function addMedia() {
  const type = $('#m-type').value;
  const url = ($('#m-url').value || '').trim();
  const title = ($('#m-title').value || '').trim();
  const pos = parseInt($('#m-pos').value) || 0;
  const dur = parseInt($('#m-dur').value) || 0;
  if (!url && type !== 'photo') { toast('Укажи ссылку или загрузи файл', 'err'); return; }
  tempMedia.push({ type, url, title, caption: title, pos, dur });
  $('#m-url').value = ''; $('#m-title').value = ''; $('#m-pos').value = ''; $('#m-dur').value = '';
  renderMediaInto();
}

async function saveChapter() {
  const bookId = $('#c-book') ? $('#c-book').value : '';
  const title = ($('#c-title').value || '').trim();
  if (!bookId) { toast('Выбери книгу', 'err'); return; }
  if (!title) { toast('Введите название', 'err'); return; }
  const payload = { book_id: bookId, num: parseInt($('#c-num').value) || 1, title, content: $('#c-content').value };
  let chapterId = editChapterId;
  if (chapterId) {
    const r = await sb.from('chapters').update(payload).eq('id', chapterId);
    if (r.error) { toast(r.error.message, 'err'); return; }
    await sb.from('media').delete().eq('chapter_id', chapterId);
  } else {
    const r = await sb.from('chapters').insert(payload).select().single();
    if (r.error) { toast(r.error.message, 'err'); return; }
    chapterId = r.data.id;
  }
  if (tempMedia.length) {
    const rows = tempMedia.map(m => ({
      chapter_id: chapterId, kind: m.type, url: m.url || null, title: m.title || null,
      caption: m.caption || null, pos: m.pos || 0, dur: m.dur || 0
    }));
    const r2 = await sb.from('media').insert(rows);
    if (r2.error) { toast(r2.error.message, 'err'); return; }
  }
  editChapterId = null; tempMedia = [];
  await loadData(); render();
  toast('Глава сохранена');
}

async function deleteChapter(id) {
  if (!confirm('Удалить главу?')) return;
  const r = await sb.from('chapters').delete().eq('id', id);
  if (r.error) { toast(r.error.message, 'err'); return; }
  await loadData(); render(); toast('Удалена');
}

// ---------- конструктор страницы ----------
const PAGE_TYPES = {
  heading: 'Заголовок', text: 'Текст', image: 'Картинка', gallery: 'Галерея',
  media: 'Музыка / видео', button: 'Кнопка', quote: 'Цитата', divider: 'Разделитель'
};
let pageSaveTimer = null;

function pageGet() {
  const id = myId();
  if (!data.pages) data.pages = {};
  if (!data.pages[id]) data.pages[id] = { slug: 'home', data: { blocks: [] } };
  const d = data.pages[id].data;
  if (!d || typeof d !== 'object') data.pages[id].data = { blocks: [] };
  if (!Array.isArray(data.pages[id].data.blocks)) data.pages[id].data.blocks = [];
  if (typeof data.pages[id].data.background !== 'string') data.pages[id].data.background = '';
  return data.pages[id].data;
}

function pageScheduleSave() {
  clearTimeout(pageSaveTimer);
  pageSaveTimer = setTimeout(pageSave, 700);
}

async function pageSave() {
  if (!authed()) return;
  const pd = pageGet();
  const res = await sb.from('site_pages').upsert({
    user_id: myId(), slug: 'home', data: pd, updated_at: new Date().toISOString()
  });
  if (res.error) toast('Страница не сохранилась: ' + res.error.message, 'err');
}

function pageBlockDefaults(type) {
  return {
    id: 'bl' + Date.now().toString(36) + Math.random().toString(36).slice(2, 4),
    type, text: type === 'heading' ? 'Заголовок' : (type === 'button' ? 'Кнопка' : ''),
    url: '', caption: '', kind: 'audio', level: 1, urls: []
  };
}

function pageAdd(type) {
  const pd = pageGet();
  pd.blocks.push(pageBlockDefaults(type));
  pageSave(); render();
}

function pageFind(id) { return pageGet().blocks.find(b => b.id === id); }

function pageField(id, field, value) {
  if (id === '__bg') { pageGet().background = value; pageScheduleSave(); return; }
  const b = pageFind(id); if (!b) return;
  if (field === 'urls') b.urls = String(value).split('\n').map(s => s.trim()).filter(Boolean);
  else if (field === 'level') b.level = Number(value) || 1;
  else b[field] = value;
  pageScheduleSave();
}

function pageMove(id, dir) {
  const pd = pageGet();
  const i = pd.blocks.findIndex(b => b.id === id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= pd.blocks.length) return;
  const t = pd.blocks[i]; pd.blocks[i] = pd.blocks[j]; pd.blocks[j] = t;
  pageSave(); render();
}

function pageDel(id) {
  const pd = pageGet();
  pd.blocks = pd.blocks.filter(b => b.id !== id);
  pageSave(); render();
}

function pageDup(id) {
  const pd = pageGet();
  const i = pd.blocks.findIndex(b => b.id === id);
  if (i < 0) return;
  const copy = JSON.parse(JSON.stringify(pd.blocks[i]));
  copy.id = pageBlockDefaults('x').id;
  pd.blocks.splice(i + 1, 0, copy);
  pageSave(); render();
}

function pageCtx(e, id) {
  e.preventDefault();
  const old = document.getElementById('pctx'); if (old) old.remove();
  const menu = document.createElement('div');
  menu.className = 'pctx'; menu.id = 'pctx';
  menu.style.left = Math.min(e.clientX, Math.max(8, innerWidth - 210)) + 'px';
  menu.style.top = Math.min(e.clientY, Math.max(8, innerHeight - 200)) + 'px';
  menu.innerHTML =
    '<button onclick="pageCtxDo(\'dup\',\'' + id + '\')">Дублировать</button>'
    + '<button onclick="pageCtxDo(\'up\',\'' + id + '\')">Выше</button>'
    + '<button onclick="pageCtxDo(\'down\',\'' + id + '\')">Ниже</button>'
    + '<button class="danger" onclick="pageCtxDo(\'del\',\'' + id + '\')">Удалить</button>';
  document.body.appendChild(menu);
}

function pageCtxDo(action, id) {
  const m = document.getElementById('pctx'); if (m) m.remove();
  if (action === 'up') pageMove(id, -1);
  else if (action === 'down') pageMove(id, 1);
  else if (action === 'del') pageDel(id);
  else if (action === 'dup') pageDup(id);
}

document.addEventListener('click', () => { const m = document.getElementById('pctx'); if (m) m.remove(); });
document.addEventListener('scroll', () => { const m = document.getElementById('pctx'); if (m) m.remove(); }, { passive: true });

function renderPageBlocks(pd) {
  return (pd.blocks || []).map(b => {
    switch (b.type) {
      case 'heading':
        return b.level === 2 ? '<h2>' + esc(b.text || '') + '</h2>' : '<h1>' + esc(b.text || '') + '</h1>';
      case 'text':
        return (b.text || '').split('\n').filter(t => t.trim()).map(t => '<p>' + esc(t) + '</p>').join('');
      case 'image':
        return '<div class="pb-img">' + (b.url ? '<img src="' + esc(b.url) + '" alt="" loading="lazy">' : '')
          + (b.caption ? '<div class="cap">' + esc(b.caption) + '</div>' : '') + '</div>';
      case 'gallery':
        return '<div class="photos">' + (b.urls || []).filter(Boolean).map(u =>
          '<div class="photo" data-url="' + esc(u) + '" onclick="openPhoto(this)"><img src="' + esc(u) + '" alt="" loading="lazy"></div>').join('')
          + '</div>' + (b.caption ? '<div class="cap">' + esc(b.caption) + '</div>' : '');
      case 'media':
        return b.kind === 'video'
          ? '<div class="video"><video controls preload="metadata"><source src="' + esc(b.url || '') + '"></video>'
            + (b.caption ? '<div class="cap">' + esc(b.caption) + '</div>' : '') + '</div>'
          : miniAudioHtml(b.url || '');
      case 'button':
        return '<a class="pb-btn" href="' + esc(b.url || '#') + '" target="_blank" rel="noopener">' + esc(b.text || 'Ссылка') + '</a>';
      case 'quote':
        return '<blockquote>' + esc(b.text || '') + '</blockquote>';
      case 'divider':
        return '<hr>';
      default:
        return '';
    }
  }).join('');
}

function pageUploadRow(blockId, field, accept, label, multiple) {
  return '<div style="display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap">'
    + '<label class="btn-ghost btn-sm" style="cursor:pointer">' + label
    + '<input type="file" accept="' + accept + '"' + (multiple ? ' multiple' : '')
    + ' style="display:none" onchange="pageUpload(this,\'' + blockId + '\',\'' + field + '\')"></label>'
    + '<span class="fnote">или перетащи файл прямо в блок</span>'
    + '</div>';
}

async function pageUploadFiles(files, blockId, field) {
  const b = pageFind(blockId);
  if (!b || !files || !files.length) return;
  toast('Загружаю файл…');
  const urls = [];
  for (let i = 0; i < files.length; i++) {
    const u = await uploadFile(files[i]);
    if (u) urls.push(u);
  }
  if (!urls.length) return;
  if (field === 'urls') b.urls = (b.urls || []).concat(urls);
  else b.url = urls[0];
  if (b.type === 'media') {
    const t = (files[0].type || '').toLowerCase();
    b.kind = t.indexOf('video') === 0 ? 'video' : 'audio';
  }
  pageSave();
  render();
  toast(urls.length > 1 ? 'Загружено файлов: ' + urls.length : 'Файл загружен');
}

function pageUpload(input, blockId, field) {
  const files = Array.prototype.slice.call(input.files || []);
  input.value = '';
  pageUploadFiles(files, blockId, field);
}

function pageDragOver(e) {
  if (e.dataTransfer && e.dataTransfer.types && Array.prototype.indexOf.call(e.dataTransfer.types, 'Files') === -1) return;
  e.preventDefault();
  if (e.currentTarget) e.currentTarget.classList.add('pdrop');
}

function pageDragLeave(e) {
  if (e.currentTarget) e.currentTarget.classList.remove('pdrop');
}

function pageDrop(e) {
  e.preventDefault();
  const el = e.currentTarget;
  if (el) el.classList.remove('pdrop');
  const id = el && el.getAttribute('data-block');
  if (!id) return;
  const files = Array.prototype.slice.call((e.dataTransfer && e.dataTransfer.files) || []);
  if (!files.length) return;
  const b = pageFind(id);
  if (!b) return;
  const field = b.type === 'gallery' ? 'urls' : 'url';
  pageUploadFiles(files, id, field);
}

function pageBlockCard(b) {
  const inp = (field, ph, val) =>
    '<input value="' + esc(val || '') + '" placeholder="' + esc(ph) + '" oninput="pageField(\'' + b.id + '\',\'' + field + '\',this.value)">';
  const area = (field, ph, val) =>
    '<textarea placeholder="' + esc(ph) + '" oninput="pageField(\'' + b.id + '\',\'' + field + '\',this.value)">' + esc(val || '') + '</textarea>';

  let fields = '';
  if (b.type === 'heading') {
    fields = '<div class="two">' + inp('text', 'Текст заголовка', b.text)
      + '<select onchange="pageField(\'' + b.id + '\',\'level\',this.value)">'
      + '<option value="1" ' + (b.level !== 2 ? 'selected' : '') + '>Крупный</option>'
      + '<option value="2" ' + (b.level === 2 ? 'selected' : '') + '>Средний</option></select></div>';
  } else if (b.type === 'text') {
    fields = area('text', 'Текст. Каждая строка — новый абзац', b.text);
  } else if (b.type === 'image') {
    fields = '<div class="two">' + inp('url', 'Ссылка на картинку', b.url) + inp('caption', 'Подпись', b.caption) + '</div>'
      + pageUploadRow(b.id, 'url', 'image/*', '📁 загрузить картинку');
  } else if (b.type === 'gallery') {
    fields = area('urls', 'Ссылки на фото — по одной в строке', (b.urls || []).join('\n'))
      + inp('caption', 'Подпись (необязательно)', b.caption)
      + pageUploadRow(b.id, 'urls', 'image/*', '📁 загрузить фото', true);
  } else if (b.type === 'media') {
    fields = '<div class="two">' + inp('url', 'Ссылка на файл (mp3 / mp4)', b.url)
      + '<select onchange="pageField(\'' + b.id + '\',\'kind\',this.value)">'
      + '<option value="audio" ' + (b.kind !== 'video' ? 'selected' : '') + '>Музыка</option>'
      + '<option value="video" ' + (b.kind === 'video' ? 'selected' : '') + '>Видео</option></select></div>'
      + inp('caption', 'Подпись', b.caption)
      + pageUploadRow(b.id, 'url', 'audio/*,video/*', '📁 загрузить файл');
  } else if (b.type === 'button') {
    fields = '<div class="two">' + inp('text', 'Надпись', b.text) + inp('url', 'Куда ведёт', b.url) + '</div>';
  } else if (b.type === 'quote') {
    fields = area('text', 'Цитата', b.text);
  }

  return '<div class="pblock" data-block="' + b.id + '" oncontextmenu="pageCtx(event,\'' + b.id + '\')"'
    + ' ondragover="pageDragOver(event)" ondragleave="pageDragLeave(event)" ondrop="pageDrop(event)">'
    + '<div class="pblock-head"><span class="pblock-type">' + esc(PAGE_TYPES[b.type] || b.type) + '</span>'
    + '<span class="pblock-acts">'
    + '<button class="btn-ghost btn-sm" title="Выше" onclick="pageMove(\'' + b.id + '\',-1)">↑</button>'
    + '<button class="btn-ghost btn-sm" title="Ниже" onclick="pageMove(\'' + b.id + '\',1)">↓</button>'
    + '<button class="btn-danger btn-sm" title="Удалить" onclick="pageDel(\'' + b.id + '\')">✕</button>'
    + '</span></div>'
    + fields + '</div>';
}

  const pd = pageGet();
  return '<div>'
